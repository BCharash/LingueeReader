<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Modern Web App Capability (Replaces deprecated Apple tag) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">
  
  <title>Linguee Reader</title>
  
  <!-- CSS Styles -->
  <style>
    :root {
      --primary-color: #2563eb;
      --background-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--background-color);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin-top: 20px;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .search-form {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    button {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary-color);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .results-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      min-height: 150px;
    }

    .status-message {
      color: var(--text-muted);
      font-style: italic;
      text-align: center;
      margin-top: 30px;
    }

    .word-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .phonetic {
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .definition-group {
      margin-bottom: 16px;
    }

    .part-of-speech {
      font-weight: 600;
      color: var(--primary-color);
      text-transform: lowercase;
      margin-bottom: 6px;
    }

    ul.definitions {
      list-style-type: disc;
      padding-left: 20px;
    }

    ul.definitions li {
      margin-bottom: 6px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Linguee Reader</h1>
    </header>

    <form class="search-form" id="searchForm">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Enter a word to lookup..." 
        required 
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
      />
      <button type="submit">Search</button>
    </form>

    <main class="results-card" id="resultsContainer">
      <p class="status-message">Enter a word above and click Search.</p>
    </main>
  </div>

  <!-- Client JavaScript for Free Dictionary API Fetching -->
  <script>
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('resultsContainer');

    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = searchInput.value.trim();

      if (!query) return;

      resultsContainer.innerHTML = `<p class="status-message">Searching for "${query}"...</p>`;

      try {
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(query)}`);

        if (!response.ok) {
          if (response.status === 404) {
            resultsContainer.innerHTML = `<p class="status-message">No definitions found for "<strong>${query}</strong>".</p>`;
          } else {
            resultsContainer.innerHTML = `<p class="status-message">Error retrieving definition (Status ${response.status}). Please try again.</p>`;
          }
          return;
        }

        const data = await response.json();
        renderResults(data[0]);

      } catch (error) {
        console.error('Fetch error:', error);
        resultsContainer.innerHTML = `<p class="status-message">Unable to connect to dictionary server. Check your connection or console logs.</p>`;
      }
    });

    function renderResults(entry) {
      const { word, phonetic, phonetics, meanings } = entry;
      
      const phoneticText = phonetic || (phonetics && phonetics.find(p => p.text)?.text) || '';

      let html = `
        <h2 class="word-title">${word}</h2>
        ${phoneticText ? `<p class="phonetic">${phoneticText}</p>` : ''}
      `;

      meanings.forEach(meaning => {
        html += `
          <div class="definition-group">
            <div class="part-of-speech">${meaning.partOfSpeech}</div>
            <ul class="definitions">
        `;

        meaning.definitions.slice(0, 3).forEach(def => {
          html += `<li>${def.definition}</li>`;
        });

        html += `
            </ul>
          </div>
        `;
      });

      resultsContainer.innerHTML = html;
    }
  </script>
</body>
</html>
