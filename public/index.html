<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Modern Web App Capability -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">
  
  <!-- Favicon Data URI to prevent 404 console errors -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
  
  <title>Linguee Reader</title>
  
  <!-- CSS Styles -->
  <style>
    :root {
      --primary-color: #2563eb;
      --background-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent-color: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--background-color);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin-top: 20px;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .search-form {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    button {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary-color);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .results-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      min-height: 150px;
    }

    .status-message {
      color: var(--text-muted);
      font-style: italic;
      text-align: center;
      margin-top: 30px;
    }

    .word-header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .word-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .pos-tag {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: lowercase;
      margin-left: 8px;
    }

    .translation-group {
      margin-bottom: 16px;
    }

    .translation-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent-color);
      margin-bottom: 6px;
    }

    .example-list {
      list-style-type: none;
      padding-left: 0;
    }

    .example-item {
      background-color: #f1f5f9;
      border-left: 3px solid var(--primary-color);
      padding: 8px 12px;
      margin-bottom: 8px;
      border-radius: 0 6px 6px 0;
      font-size: 0.95rem;
    }

    .example-src {
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .example-target {
      color: var(--text-muted);
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Linguee Reader</h1>
    </header>

    <form class="search-form" id="searchForm">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Search English or Portuguese..." 
        required 
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
      />
      <button type="submit">Search</button>
    </form>

    <main class="results-card" id="resultsContainer">
      <p class="status-message">Enter an English or Portuguese word to translate.</p>
    </main>
  </div>

  <script>
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('resultsContainer');

    // Only fire the search query when submitting the form (clicking Search or hitting Enter)
    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = searchInput.value.trim();

      if (!query) return;

      resultsContainer.innerHTML = `<p class="status-message">Searching Linguee for "${query}"...</p>`;

      try {
        const response = await fetch(`https://linguee-api.herokuapp.com/api?q=${encodeURIComponent(query)}&source=auto&target=pt`);

        if (!response.ok) {
          resultsContainer.innerHTML = `<p class="status-message">Nenhum resultado encontrado para "<strong>${query}</strong>".</p>`;
          return;
        }

        const data = await response.json();

        if (!data.exact_matches || data.exact_matches.length === 0) {
          resultsContainer.innerHTML = `<p class="status-message">Nenhum resultado encontrado para "<strong>${query}</strong>".</p>`;
          return;
        }

        renderResults(query, data.exact_matches);

      } catch (error) {
        console.error('Fetch error:', error);
        resultsContainer.innerHTML = `<p class="status-message">Error connecting to Linguee service. Check your connection or console logs.</p>`;
      }
    });

    function renderResults(query, matches) {
      let html = `<div class="word-header"><span class="word-title">${query}</span></div>`;

      matches.forEach(match => {
        const wordText = match.text || query;
        const pos = match.pos ? `<span class="pos-tag">(${match.pos})</span>` : '';

        html += `<div style="margin-bottom: 20px;">`;
        if (match.text && match.text.toLowerCase() !== query.toLowerCase()) {
          html += `<div style="font-weight:600; margin-bottom: 8px;">${wordText} ${pos}</div>`;
        }

        if (match.translations && match.translations.length > 0) {
          match.translations.forEach(trans => {
            html += `
              <div class="translation-group">
                <div class="translation-title">${trans.text} ${trans.pos ? `<span class="pos-tag">(${trans.pos})</span>` : ''}</div>
            `;

            if (trans.examples && trans.examples.length > 0) {
              html += `<ul class="example-list">`;
              trans.examples.slice(0, 2).forEach(ex => {
                html += `
                  <li class="example-item">
                    <div class="example-src">${ex.src}</div>
                    <div class="example-target">${ex.dst}</div>
                  </li>
                `;
              });
              html += `</ul>`;
            }

            html += `</div>`;
          });
        }
        html += `</div>`;
      });

      resultsContainer.innerHTML = html;
    }
  </script>
</body>
</html>
