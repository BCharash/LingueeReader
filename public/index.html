<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Dicionário PT/EN</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --text-main: #FFFFFF;
      --text-sub: #A0A0A0;
      --accent-gold: #FFD700;
      --accent-green: #4EED94;
      --border-color: #2A2A2A;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    h1 {
      font-size: 28px;
      color: var(--text-sub);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .search-box {
      width: 100%;
      box-sizing: border-box;
      background-color: #1A1A1A;
      color: #FFFFFF;
      border: 3px solid #444444;
      border-radius: 12px;
      padding: 18px 20px;
      font-size: 28px;
      margin-bottom: 24px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--accent-gold);
    }

    .card {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .source-word {
      font-size: 32px;
      font-weight: bold;
      color: var(--accent-gold);
      margin-bottom: 6px;
    }

    .pos-tag {
      font-size: 20px;
      color: var(--text-sub);
      font-style: italic;
      margin-bottom: 12px;
    }

    .translation-list {
      font-size: 26px;
      color: var(--accent-green);
      font-weight: 600;
    }

    .example-title {
      font-size: 22px;
      color: var(--text-sub);
      text-transform: uppercase;
      margin-top: 16px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
    }

    .example-item {
      margin-bottom: 14px;
    }

    .example-src {
      color: #FFFFFF;
      font-size: 22px;
    }

    .example-tgt {
      color: var(--accent-green);
      font-size: 22px;
    }

    .status-msg {
      font-size: 24px;
      color: var(--text-sub);
      text-align: center;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Português ⇄ English</h1>
    <input 
      type="text" 
      id="searchInput" 
      class="search-box" 
      placeholder="Pesquisar..." 
      autocorrect="off" 
      autocapitalize="off"
    />

    <div id="status" class="status-msg">Digite uma palavra acima...</div>
    <div id="results"></div>
  </div>

  <script>
    const input = document.getElementById('searchInput');
    const status = document.getElementById('status');
    const results = document.getElementById('results');

    let debounceTimer;

    input.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      const query = e.target.value.trim();

      if (!query) {
        status.innerText = 'Digite uma palavra acima...';
        results.innerHTML = '';
        return;
      }

      status.innerText = 'A pesquisar...';

      debounceTimer = setTimeout(async () => {
        try {
          const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
          const data = await res.json();

          if (!data.results || data.results.length === 0) {
            status.innerText = 'Nenhum resultado encontrado.';
            results.innerHTML = '';
            return;
          }

          status.innerText = '';
          
          let html = '';

          // Render Main Word Cards
          data.results.forEach(item => {
            html += `
              <div class="card">
                <div class="source-word">${item.word}</div>
                ${item.pos ? `<div class="pos-tag">${item.pos}</div>` : ''}
                <div class="translation-list">${item.translations.join(' • ')}</div>
              </div>
            `;
          });

          // Render Context Examples Card
          if (data.examples && data.examples.length > 0) {
            html += `<div class="card">
              <div class="example-title">Exemplos de Contexto</div>`;
            data.examples.forEach(ex => {
              html += `
                <div class="example-item">
                  <div class="example-src">• ${ex.source}</div>
                  <div class="example-tgt">&nbsp; ${ex.target}</div>
                </div>
              `;
            });
            html += `</div>`;
          }

          results.innerHTML = html;

        } catch (err) {
          status.innerText = 'Erro ao carregar dados.';
        }
      }, 400);
    });
  </script>
</body>
</html>
